name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CMS_EXPORT_TOKEN: ${{ secrets.CMS_EXPORT_TOKEN }}

      - name: Write Facebook CAPI config (not committed to git)
        run: |
          cat > dist/api/fb-capi-config.php <<PHP
          <?php
          define('FB_PIXEL_ID', '593003523500900');
          define('FB_ACCESS_TOKEN', '${{ secrets.FB_CAPI_TOKEN }}');
          PHP

      - name: Write acesso (login/signup) config (not committed to git)
        run: |
          cat > dist/acesso/config.php <<PHP
          <?php
          define('DB_HOST', '${{ secrets.ACESSO_DB_HOST }}');
          define('DB_NAME', '${{ secrets.ACESSO_DB_NAME }}');
          define('DB_USER', '${{ secrets.ACESSO_DB_USER }}');
          define('DB_PASS', '${{ secrets.ACESSO_DB_PASS }}');
          define('GITHUB_ADMIN_TOKEN', '${{ secrets.ACESSO_GITHUB_ADMIN_TOKEN }}');
          define('GITHUB_OAUTH_CLIENT_ID', '${{ secrets.ACESSO_GITHUB_OAUTH_CLIENT_ID }}');
          define('GITHUB_OAUTH_CLIENT_SECRET', '${{ secrets.ACESSO_GITHUB_OAUTH_CLIENT_SECRET }}');
          PHP

      - name: Write admin CMS config (not committed to git)
        run: |
          cat > dist/admin/config.php <<PHP
          <?php
          define('DB_HOST', '${{ secrets.ACESSO_DB_HOST }}');
          define('DB_NAME', '${{ secrets.ACESSO_DB_NAME }}');
          define('DB_USER', '${{ secrets.ACESSO_DB_USER }}');
          define('DB_PASS', '${{ secrets.ACESSO_DB_PASS }}');
          define('CMS_EXPORT_TOKEN', '${{ secrets.CMS_EXPORT_TOKEN }}');
          PHP

      - name: Deploy to Hostinger via SSH/rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: domains/mclair.com.br/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
