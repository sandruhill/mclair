; expose_php is PHP_INI_SYSTEM scope -- confirmed via live test that it can't
; actually be overridden here (the X-Powered-By header stays regardless).
; Left set anyway (harmless no-op) in case a future host config allows it.
; display_errors is PHP_INI_ALL and does take effect here -- hides error
; detail from any response that isn't caught by our own code first.
expose_php = Off
display_errors = Off
